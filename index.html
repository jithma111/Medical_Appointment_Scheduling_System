<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediSchedule – Medical Appointment Scheduling</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12343b;--teal:#1f7a8c;--mist:#eef5f6;--line:#d3e2e5}
body{font-family:Figtree,system-ui,sans-serif;background:var(--mist);color:var(--ink)}
.bar{background:var(--ink);color:#fff}.bar .brand{font-weight:700;font-size:1.25rem;letter-spacing:.2px}
.btn-main{background:var(--teal);border-color:var(--teal);color:#fff}.btn-main:hover{background:#17606e;color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.25rem}
.nav-tabs .nav-link{color:var(--ink)}.nav-tabs .nav-link.active{color:var(--teal);font-weight:600}
.slot{min-width:84px}.login-wrap{max-width:440px;margin:6vh auto}
h1,h2,h3,h4,h5{font-weight:700}.table{--bs-table-bg:transparent}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K='medischedule', h=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(16)};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){return{admins:[{id:'AD001',username:'admin',pw:h('admin123'),name:'System Admin'}],patients:[],appts:[],recs:[],
 doctors:[{id:'D001',username:'dr_silva',pw:h('doctor123'),name:'Dr. Nimal Silva',spec:'Cardiology',fee:3500,slots:['09:00','09:30','10:00','10:30']},
          {id:'D002',username:'dr_perera',pw:h('doctor123'),name:'Dr. Anula Perera',spec:'Pediatrics',fee:2500,slots:['14:00','14:30','15:00']}]}}
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||seed();
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const nid=(p,l)=>p+String(Math.max(0,...l.map(x=>+x.id.slice(p.length)||0))+1).padStart(3,'0');
const S={user:null,role:null,tab:'',msg:null,doc:'',date:'',resch:null,done:null,q:''};
const flash=(t,m)=>S.msg={t,m};
const nameOf=id=>[...db.doctors,...db.patients].find(x=>x.id==id)?.name||id;
const badge=s=>`<span class="badge ${{PENDING:'bg-warning text-dark',CONFIRMED:'bg-primary',COMPLETED:'bg-success'}[s]||'bg-secondary'}">${s}</span>`;
const taken=(d,date)=>db.appts.filter(a=>a.doc==d&&a.date==date&&a.status!='CANCELLED').map(a=>a.time);
function free(d,date){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw'Date must be in yyyy-MM-dd format';
 if(date<today())throw'Date cannot be in the past';
 const doc=db.doctors.find(x=>x.id==d);if(!doc)throw'Doctor not found';
 return doc.slots.filter(s=>!taken(d,date).includes(s))}
function slotsCsv(csv){const s=[...new Set(csv.split(',').map(x=>x.trim()).filter(Boolean))].sort();
 if(!s.length)throw'At least one time slot is required';
 for(const x of s)if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(x))throw`Invalid slot '${x}' (use HH:mm, e.g. 09:30)`;return s}
const taken_user=u=>[...db.admins,...db.patients,...db.doctors].some(x=>x.username.toLowerCase()==u.toLowerCase());
const checkUser=(u,p)=>{if(!/^[A-Za-z0-9_]{4,20}$/.test(u))throw'Username: 4-20 letters, digits or _';
 if((p||'').length<6)throw'Password must be at least 6 characters';if(taken_user(u))throw'Username already taken'};

/* ---------- actions ---------- */
const A={
 login(f){const u=f.username.trim().toLowerCase();
  for(const [role,list] of [['admin',db.admins],['patient',db.patients],['doctor',db.doctors]]){
   const m=list.find(x=>x.username.toLowerCase()==u&&x.pw==h(f.password));
   if(m){S.user=m;S.role=role;S.tab=role=='admin'?'doctors':role=='doctor'?'appts':'appts';return}}
  throw'Invalid username or password'},
 register(f){const age=+f.age;if(!f.name.trim())throw'Name is required';
  if(!(age>=0&&age<=120)||f.age==='')throw'Age must be between 0 and 120';
  if(!/^0\d{9}$/.test(f.phone))throw'Phone must be 10 digits starting with 0';
  checkUser(f.username,f.password);
  db.patients.push({id:nid('P',db.patients),username:f.username,pw:h(f.password),name:f.name.trim(),age,phone:f.phone});
  S.tab='login';flash('success','Registration successful. You can now log in.')},
 logout(){S.user=S.role=null;S.tab='';flash('info','You have been logged out.')},
 tab(f,el){S.tab=el.dataset.tab;S.resch=S.done=null},
 search(f){S.q=f.q.trim()},
 check(f){free(f.doc,f.date);S.doc=f.doc;S.date=f.date},
 book(f,el){const {doc,date,slot}=el.dataset;if(!free(doc,date).includes(slot))throw'That slot is not available';
  db.appts.push({id:nid('A',db.appts),pt:S.user.id,doc,date,time:slot,status:'PENDING'});
  S.tab='appts';flash('success','Appointment booked. The doctor will confirm it shortly.')},
 cancel(f,el){const a=db.appts.find(x=>x.id==el.dataset.id);a.status='CANCELLED';flash('success','Appointment cancelled.')},
 reschedStart(f,el){S.resch={id:el.dataset.id,date:''}},
 reschedCheck(f){free(db.appts.find(x=>x.id==S.resch.id).doc,f.date);S.resch.date=f.date},
 reschedPick(f,el){const a=db.appts.find(x=>x.id==S.resch.id);
  if(!free(a.doc,S.resch.date).includes(el.dataset.slot))throw'That slot is not available';
  a.date=S.resch.date;a.time=el.dataset.slot;a.status='PENDING';S.resch=null;
  flash('success','Appointment rescheduled. The doctor needs to confirm the new time.')},
 profile(f){if(!/^0\d{9}$/.test(f.phone))throw'Phone must be 10 digits starting with 0';
  if(f.password&&f.password.length<6)throw'Password must be at least 6 characters';
  const p=db.patients.find(x=>x.id==S.user.id);p.phone=f.phone;if(f.password)p.pw=h(f.password);S.user=p;flash('success','Profile updated.')},
 confirm(f,el){db.appts.find(x=>x.id==el.dataset.id).status='CONFIRMED';flash('success','Appointment '+el.dataset.id+' confirmed.')},
 completeStart(f,el){S.done=el.dataset.id},
 complete(f){if(!f.diagnosis.trim())throw'Diagnosis is required';
  const rx=[1,2,3].filter(i=>f['med'+i].trim()).map(i=>({med:f['med'+i].trim(),dose:f['dose'+i].trim(),dur:f['dur'+i].trim()}));
  const a=db.appts.find(x=>x.id==S.done);
  db.recs.push({id:nid('M',db.recs),pt:a.pt,doc:a.doc,appt:a.id,date:today(),diagnosis:f.diagnosis.trim(),notes:f.notes.trim(),rx});
  a.status='COMPLETED';S.done=null;flash('success','Medical record saved. Appointment marked as completed.')},
 slots(f){const d=db.doctors.find(x=>x.id==S.user.id);d.slots=slotsCsv(f.slots);flash('success','Daily time slots updated.')},
 addDoctor(f){if(!f.name.trim()||!f.spec.trim())throw'Name and specialization are required';
  if(!(+f.fee>=0)||f.fee==='')throw'Fee must be a non-negative number';checkUser(f.username,f.password);
  db.doctors.push({id:nid('D',db.doctors),username:f.username,pw:h(f.password),name:f.name.trim(),spec:f.spec.trim(),fee:+f.fee,slots:slotsCsv(f.slots)});
  flash('success','Doctor added.')},
 updateFee(f,el){if(!(+f.fee>=0)||f.fee==='')throw'Fee must be a non-negative number';
  db.doctors.find(x=>x.id==el.dataset.id).fee=+f.fee;flash('success','Fee updated.')},
 delDoctor(f,el){db.doctors=db.doctors.filter(x=>x.id!=el.dataset.id);flash('success','Doctor deleted.')},
 delPatient(f,el){db.patients=db.patients.filter(x=>x.id!=el.dataset.id);flash('success','Patient deleted.')},
 reset(){if(confirm('Erase all demo data?')){db=seed();S.user=S.role=null;S.tab='';flash('info','Demo data reset.')}}
};
function run(name,f,el){try{A[name](f||{},el||{});save()}catch(e){flash('danger',typeof e=='string'?e:e.message)}render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)run(el.dataset.act,{},el)});
document.addEventListener('submit',e=>{const el=e.target.closest('[data-form]');if(!el)return;e.preventDefault();
 run(el.dataset.form,Object.fromEntries(new FormData(el)),el)});

/* ---------- views ---------- */
const field=(n,l,t='text',x='')=>`<div class="mb-3"><label class="form-label">${l}</label><input class="form-control" name="${n}" type="${t}" ${x}></div>`;
const empty=m=>`<p class="text-muted mb-0">${m}</p>`;
const tabs=l=>`<ul class="nav nav-tabs mb-3">${l.map(([k,t])=>`<li class="nav-item"><a href="#" class="nav-link ${S.tab==k?'active':''}" data-act="tab" data-tab="${k}" onclick="return false">${t}</a></li>`).join('')}</ul>`;
const slotBtns=(arr,attrs)=>arr.length?arr.map(s=>`<button class="btn btn-outline-primary slot me-2 mb-2" data-act="${attrs}" data-slot="${s}">${s}</button>`).join(''):empty('No free slots on this date. Try another day.');

function loginView(){const reg=S.tab=='register';return`<div class="login-wrap"><div class="text-center mb-4"><h1>MediSchedule</h1><p class="text-muted">Book and manage doctor appointments.</p></div>
<div class="panel"><ul class="nav nav-tabs mb-3"><li class="nav-item"><a href="#" class="nav-link ${!reg?'active':''}" data-act="tab" data-tab="login" onclick="return false">Log in</a></li>
<li class="nav-item"><a href="#" class="nav-link ${reg?'active':''}" data-act="tab" data-tab="register" onclick="return false">Register as patient</a></li></ul>
${reg?`<form data-form="register">${field('name','Full name')}<div class="row"><div class="col">${field('age','Age','number','min=0 max=120')}</div><div class="col">${field('phone','Phone','tel','placeholder="0771234567"')}</div></div>${field('username','Username')}${field('password','Password (6+ characters)','password')}<button class="btn btn-main w-100">Create account</button></form>`
:`<form data-form="login">${field('username','Username')}${field('password','Password','password')}<button class="btn btn-main w-100">Log in</button></form>
<p class="small text-muted mt-3 mb-0">Demo accounts: admin / admin123, dr_silva / doctor123</p>`}</div></div>`}

function apptTable(list,role){if(!list.length)return empty('No appointments yet.');
 return`<div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>${role=='patient'?'Doctor':'Patient'}</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr></thead><tbody>${
 list.map(a=>{let b='';
  if(role=='patient'&&(a.status=='PENDING'||a.status=='CONFIRMED'))b=`<button class="btn btn-sm btn-outline-primary me-1" data-act="reschedStart" data-id="${a.id}">Reschedule</button><button class="btn btn-sm btn-outline-danger" data-act="cancel" data-id="${a.id}">Cancel</button>`;
  if(role=='doctor'&&a.status=='PENDING')b=`<button class="btn btn-sm btn-main" data-act="confirm" data-id="${a.id}">Confirm</button>`;
  if(role=='doctor'&&a.status=='CONFIRMED')b=`<button class="btn btn-sm btn-success" data-act="completeStart" data-id="${a.id}">Write record</button>`;
  return`<tr><td>${a.id}</td><td>${esc(nameOf(role=='patient'?a.doc:a.pt))}</td><td>${a.date}</td><td>${a.time}</td><td>${badge(a.status)}</td><td class="text-end">${b}</td></tr>`}).join('')}</tbody></table></div>`}
const sorted=l=>[...l].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

function patientView(){const me=S.user,t=S.tab;let c='';
 if(t=='appts'){c=`<div class="panel">${apptTable(sorted(db.appts.filter(a=>a.pt==me.id)),'patient')}</div>`;
  if(S.resch){const a=db.appts.find(x=>x.id==S.resch.id);let sl='';
   if(S.resch.date){try{sl=slotBtns(free(a.doc,S.resch.date),'reschedPick')}catch(e){sl=`<div class="text-danger">${e}</div>`}}
   c+=`<div class="panel mt-3"><h5>Reschedule ${a.id} with ${esc(nameOf(a.doc))}</h5><form data-form="reschedCheck" class="row g-2 mb-3"><div class="col-auto"><input class="form-control" type="date" name="date" min="${today()}" value="${S.resch.date}" required></div><div class="col-auto"><button class="btn btn-main">Check slots</button></div></form>${sl}</div>`}}
 if(t=='book'){const ds=db.doctors.filter(d=>!S.q||(d.name+d.spec).toLowerCase().includes(S.q.toLowerCase()));
  c=`<div class="panel mb-3"><form data-form="search" class="row g-2"><div class="col"><input class="form-control" name="q" value="${esc(S.q)}" placeholder="Search by doctor name or specialization"></div><div class="col-auto"><button class="btn btn-main">Search</button></div></form></div>
  <div class="panel mb-3">${ds.length?`<div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Doctor</th><th>Specialization</th><th>Fee (LKR)</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.spec)}</td><td>${d.fee.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`:empty('No doctors match that search.')}</div>
  <div class="panel"><h5>Book a visit</h5><form data-form="check" class="row g-2 mb-3"><div class="col-md-5"><select class="form-select" name="doc" required>${db.doctors.map(d=>`<option value="${d.id}" ${S.doc==d.id?'selected':''}>${esc(d.name)} – ${esc(d.spec)}</option>`).join('')}</select></div>
  <div class="col-md-4"><input class="form-control" type="date" name="date" min="${today()}" value="${S.date}" required></div><div class="col-auto"><button class="btn btn-main">Check slots</button></div></form>
  ${S.doc&&S.date?(()=>{try{return`<div data-doc="${S.doc}">${free(S.doc,S.date)&&slotBtns(free(S.doc,S.date),'book" data-doc="'+S.doc+'" data-date="'+S.date)}</div>`}catch(e){return`<div class="text-danger">${e}</div>`}})():empty('Choose a doctor and date to see free times.')}</div>`}
 if(t=='history'){const r=db.recs.filter(x=>x.pt==me.id);
  c=`<div class="panel">${r.length?r.map(x=>`<div class="border-bottom pb-3 mb-3"><strong>${x.date}</strong> with ${esc(nameOf(x.doc))}<div>Diagnosis: ${esc(x.diagnosis)}</div>${x.notes?`<div class="text-muted">${esc(x.notes)}</div>`:''}${x.rx.length?`<ul class="mb-0 mt-2">${x.rx.map(p=>`<li>${esc(p.med)} – ${esc(p.dose)} for ${esc(p.dur)}</li>`).join('')}</ul>`:''}</div>`).join(''):empty('Your medical records will appear here after a visit.')}</div>`}
 if(t=='profile')c=`<div class="panel" style="max-width:480px"><p class="mb-1"><strong>${esc(me.name)}</strong> (${me.id}), age ${me.age}</p><form data-form="profile" class="mt-3">${field('phone','Phone','tel',`value="${esc(me.phone)}"`)}${field('password','New password (leave blank to keep)','password')}<button class="btn btn-main">Save changes</button></form></div>`;
 return tabs([['appts','My appointments'],['book','Book appointment'],['history','Medical history'],['profile','Profile']])+c}

function doctorView(){const me=db.doctors.find(d=>d.id==S.user.id),t=S.tab;let c='';
 if(t=='appts'){c=`<div class="panel">${apptTable(sorted(db.appts.filter(a=>a.doc==me.id)),'doctor')}</div>`;
  if(S.done){const a=db.appts.find(x=>x.id==S.done);
   c+=`<div class="panel mt-3"><h5>Medical record for ${esc(nameOf(a.pt))} (${a.id})</h5><form data-form="complete">${field('diagnosis','Diagnosis')}${field('notes','Notes')}
   ${[1,2,3].map(i=>`<div class="row g-2 mb-2"><div class="col-md-5"><input class="form-control" name="med${i}" placeholder="Medicine ${i}"></div><div class="col-md-3"><input class="form-control" name="dose${i}" placeholder="Dosage"></div><div class="col-md-4"><input class="form-control" name="dur${i}" placeholder="Duration"></div></div>`).join('')}
   <button class="btn btn-success mt-2">Save record and complete</button></form></div>`}}
 if(t=='schedule')c=`<div class="panel" style="max-width:520px"><h5>Daily time slots</h5><p class="text-muted">Separate times with commas, in HH:mm format.</p><form data-form="slots"><input class="form-control mb-3" name="slots" value="${me.slots.join(', ')}"><button class="btn btn-main">Save slots</button></form></div>`;
 return tabs([['appts','Appointments'],['schedule','My schedule']])+c}

function adminView(){const t=S.tab;let c='';
 if(t=='doctors')c=`<div class="panel mb-3"><h5>Add doctor</h5><form data-form="addDoctor" class="row g-2">
  <div class="col-md-4"><input class="form-control" name="name" placeholder="Full name"></div><div class="col-md-4"><input class="form-control" name="spec" placeholder="Specialization"></div><div class="col-md-4"><input class="form-control" name="fee" type="number" min="0" placeholder="Fee (LKR)"></div>
  <div class="col-md-4"><input class="form-control" name="username" placeholder="Username"></div><div class="col-md-4"><input class="form-control" name="password" type="password" placeholder="Password"></div><div class="col-md-4"><input class="form-control" name="slots" placeholder="Slots: 09:00, 09:30"></div>
  <div class="col-12"><button class="btn btn-main">Add doctor</button></div></form></div>
  <div class="panel"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Name</th><th>Specialization</th><th>Fee</th><th></th></tr></thead><tbody>${db.doctors.map(d=>`<tr><td>${d.id}</td><td>${esc(d.name)}</td><td>${esc(d.spec)}</td>
  <td><form data-form="updateFee" data-id="${d.id}" class="d-flex gap-1"><input class="form-control form-control-sm" style="width:100px" name="fee" type="number" min="0" value="${d.fee}"><button class="btn btn-sm btn-outline-primary">Update</button></form></td>
  <td class="text-end"><button class="btn btn-sm btn-outline-danger" data-act="delDoctor" data-id="${d.id}">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`;
 if(t=='patients')c=`<div class="panel">${db.patients.length?`<div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Phone</th><th></th></tr></thead><tbody>${db.patients.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.age}</td><td>${esc(p.phone)}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" data-act="delPatient" data-id="${p.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:empty('No patients have registered yet.')}</div>`;
 if(t=='all')c=`<div class="panel">${db.appts.length?`<div class="table-responsive"><table class="table mb-0"><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody>${sorted(db.appts).map(a=>`<tr><td>${a.id}</td><td>${esc(nameOf(a.pt))}</td><td>${esc(nameOf(a.doc))}</td><td>${a.date}</td><td>${a.time}</td><td>${badge(a.status)}</td></tr>`).join('')}</tbody></table></div>`:empty('No appointments have been booked yet.')}</div>`;
 return tabs([['doctors','Doctors'],['patients','Patients'],['all','All appointments']])+c}

function render(){
 const m=S.msg;S.msg=null;
 const alert=m?`<div class="alert alert-${m.t} alert-dismissible" role="alert">${esc(m.m)}<button class="btn-close" data-bs-dismiss="alert" onclick="this.parentNode.remove()"></button></div>`:'';
 if(!S.user){document.getElementById('app').innerHTML=`<div class="container">${alert}${loginView()}</div>`;return}
 const body={patient:patientView,doctor:doctorView,admin:adminView}[S.role]();
 document.getElementById('app').innerHTML=`<nav class="bar py-3 mb-4"><div class="container d-flex justify-content-between align-items-center"><span class="brand">MediSchedule</span>
 <span>${esc(S.user.name)} <span class="badge bg-light text-dark ms-1">${S.role}</span> <button class="btn btn-sm btn-outline-light ms-2" data-act="logout">Log out</button></span></div></nav>
 <div class="container pb-5">${alert}${body}<p class="text-muted small mt-4">Demo version: data is stored in this browser only. <a href="#" data-act="reset" onclick="return false">Reset demo data</a></p></div>`}
render();
</script>
</body>
</html>
